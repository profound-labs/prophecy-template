[book]
title = "The Book"
authors = ["The Author"]
language = "en"
multilingual = false
src = "manuscript/markdown"

[build]
build-dir = "book"
create-missing = true

[output.epub]
additional-css = ["assets/stylesheets/output-epub.css"]
epub-version = 3
use-default-css = false
no-section-label = true
footnote-backrefs = true
curly-quotes = true
cover-image = "desktop-cover.jpg"
additional-resources = []
# additional-resources = ["assets/fonts/NunitoSansX-Regular.ttf", "assets/fonts/NunitoSansX-Italic.ttf", "assets/fonts/NunitoSansX-Bold.ttf", "assets/fonts/OpenSansX-Regular.ttf"]
